# Lab only: single etcd member, throwaway credentials. A real deployment runs a
# three-member etcd and keeps secrets out of the compose file.
x-patroni: &patroni
  build: ./patroni
  depends_on: [etcd]
  environment: &patroni-env
    PATRONI_SCOPE: lab
    PATRONI_ETCD3_HOSTS: etcd:2379
    PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
    PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
    PATRONI_SUPERUSER_USERNAME: postgres
    PATRONI_SUPERUSER_PASSWORD: lab-superuser
    PATRONI_REPLICATION_USERNAME: replicator
    PATRONI_REPLICATION_PASSWORD: lab-replicator
    APP_PASSWORD: lab-app

services:
  etcd:
    image: quay.io/coreos/etcd:v3.7.2
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379

  patroni1:
    <<: *patroni
    hostname: patroni1
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
    ports: ["127.0.0.1:8008:8008"]
    volumes: ["patroni1-data:/var/lib/postgresql/data"]

  patroni2:
    <<: *patroni
    hostname: patroni2
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
    ports: ["127.0.0.1:8009:8008"]
    volumes: ["patroni2-data:/var/lib/postgresql/data"]

  patroni3:
    <<: *patroni
    hostname: patroni3
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni3:5432
    ports: ["127.0.0.1:8010:8008"]
    volumes: ["patroni3-data:/var/lib/postgresql/data"]

  haproxy:
    image: haproxy:3.2-alpine
    depends_on: [patroni1, patroni2, patroni3]
    volumes: ["./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    ports: ["127.0.0.1:15000:5000", "127.0.0.1:15001:5001", "127.0.0.1:17000:7000"]

  # Tools container: psql and pg_basebackup on the same network.
  client:
    image: postgres:17
    entrypoint: ["sleep", "infinity"]
    environment:
      PGCONNECT_TIMEOUT: "1"
    volumes: ["./results:/results"]

volumes:
  patroni1-data:
  patroni2-data:
  patroni3-data:
