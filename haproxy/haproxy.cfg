global
    maxconn 200

defaults
    mode tcp
    timeout connect 2s
    timeout client 30s
    timeout server 30s
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions init-addr last,libc,none

# Read/write: only the node whose REST API answers 200 on /primary.
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# Read-only: replicas only.
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
